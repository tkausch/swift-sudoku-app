# Generates Sudoku.xcodeproj: `cd iOS && xcodegen`.
# SwiftPM can't build an iOS app bundle, so this wraps the package's SudokuAppUI in one.
name: Sudoku
options:
  bundleIdPrefix: com.example   # change to your own prefix
  deploymentTarget:
    iOS: "17.0"
packages:
  SudokuApp:
    path: ..
targets:
  # Not "SudokuApp": that is the package's macOS executable, and Xcode would pick its scheme.
  Sudoku:
    type: application
    platform: iOS
    sources: [Sudoku]
    dependencies:
      - package: SudokuApp
        product: SudokuAppUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sudoku
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
